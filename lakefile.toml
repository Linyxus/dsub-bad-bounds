name = "dsub-bad-bounds"
defaultTargets = ["Resolution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# The definitions: types, contexts and subtyping of kernel D<: with bad bounds, and the
# numbering of judgments.
[[lean_lib]]
name = "Dsub"

# The proof.
[[lean_lib]]
name = "Resolution"
